<svg xmlns="http://www.w3.org/2000/svg" width="360" height="214">
  <style>
    svg {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        Segoe UI,
        Helvetica,
        Arial,
        sans-serif,
        Apple Color Emoji,
        Segoe UI Emoji;
      font-size: 14px;
      line-height: 21px;
    }

    #background {
      fill: #00000000;
      stroke: #8B8B8B22;
      stroke-width: 1px;
    }

    foreignObject {
      width: 318px;
      height: 180px;
    }

    .wrap {
      width: 100%;
      height: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 12px;
      line-height: 24px;
      font-size: 16px;
      font-weight: 600;
      color: rgb(72, 148, 224);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rows {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .row {
      display: grid;
      gap: 10px;
      align-items: center;
      height: 26px;

      transform: translateX(-500%);
      animation-name: slideIn;
      animation-duration: 1s;
      animation-function: ease-in-out;
      animation-fill-mode: forwards;
    }

    .row.language {
      grid-template-columns: 5px 70px 60px 1fr 42px;
    }

    .row.project {
      grid-template-columns: minmax(70px, 1.3fr) 1fr 60px;
    }

    @keyframes slideIn {
      to {
        transform: translateX(0);
      }
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
      box-shadow: 0 0 0 1px #00000012;
    }

    .lang {
      font-size: 12px;
      font-weight: 600;
      color: rgb(135, 135, 135);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .time {
      font-size: 12px;
      color: rgb(150, 150, 150);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .project-time {
      text-align: right;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.05rem;
    }

    .percent {
      font-size: 12px;
      color: rgb(150, 150, 150);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .bar-background {
      display: flex;
      height: 8px;
      border-radius: 999px;
      background: #8B8B8B22;
      overflow: hidden;
    }

    .bar-fill {
      display: block;
      height: 100%;
      border-radius: 999px 0 0 999px;
      opacity: 0.9;
      flex: 0 0 auto;
      position: relative;
      --bar-cap-size: 8px;
    }

    .bar-fill::after {
      content: "";
      position: absolute;
      right: calc(var(--bar-cap-size) / -2);
      width: var(--bar-cap-size);
      height: 100%;
      background: inherit;
      border-radius: 999px;
    }

    .bar-fill-full {
      border-radius: 999px;
    }

    .bar-fill-full::after,
    .bar-fill-empty::after {
      display: none;
    }

    .bar-fill-empty {
      display: none;
    }
  </style>

  <rect
    id="background"
    x="5"
    y="5"
    rx="6"
    ry="6"
    width="350"
    height="204"
    fill="none"
    stroke="#8B8B8B22"
    stroke-width="1"
  />

  <foreignObject
    x="21"
    y="17"
    width="318"
    height="180"
  >
    <div xmlns="http://www.w3.org/1999/xhtml" class="wrap">
      <h2>Languages · 86 hours 5 minutes</h2>
      <ul class="rows">
        <li class="row language" style="animation-delay:0ms;">
          <span class="dot" style="background:#083fa1;"/>
          <span class="lang" title="Markdown">Markdown</span>
          <span class="time" title="28 h 22 m">28 h 22 m</span>
          <span class="bar">
            <span class="bar-background">
              <span class="bar-fill" style="width:54.0836%; background:#083fa1;"/>
            </span>
          </span>
          <span class="percent">33.0%</span>
        </li>
        <li class="row language" style="animation-delay:150ms;">
          <span class="dot" style="background:#3178c6;"/>
          <span class="lang" title="TypeScript">TypeScript</span>
          <span class="time" title="11 h 58 m">11 h 58 m</span>
          <span class="bar">
            <span class="bar-background">
              <span class="bar-fill" style="width:22.8283%; background:#3178c6;"/>
            </span>
          </span>
          <span class="percent">13.9%</span>
        </li>
        <li class="row language" style="animation-delay:300ms;">
          <span class="dot" style="background:#cb171e;"/>
          <span class="lang" title="YAML">YAML</span>
          <span class="time" title="4 h 53 m">4 h 53 m</span>
          <span class="bar">
            <span class="bar-background">
              <span class="bar-fill" style="width:9.3296%; background:#cb171e;"/>
            </span>
          </span>
          <span class="percent">5.7%</span>
        </li>
        <li class="row language" style="animation-delay:450ms;">
          <span class="dot" style="background:#d0d7de;"/>
          <span class="lang" title="Text">Text</span>
          <span class="time" title="4 h 31 m">4 h 31 m</span>
          <span class="bar">
            <span class="bar-background">
              <span class="bar-fill" style="width:8.6203%; background:#d0d7de;"/>
            </span>
          </span>
          <span class="percent">5.3%</span>
        </li>
        <li class="row language" style="animation-delay:600ms;">
          <span class="dot" style="background:#3572A5;"/>
          <span class="lang" title="Python">Python</span>
          <span class="time" title="2 h 41 m">2 h 41 m</span>
          <span class="bar">
            <span class="bar-background">
              <span class="bar-fill" style="width:5.1383%; background:#3572A5;"/>
            </span>
          </span>
          <span class="percent">3.1%</span>
        </li>
      </ul>
    </div>
  </foreignObject>
</svg>