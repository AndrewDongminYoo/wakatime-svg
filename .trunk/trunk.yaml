# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  files:
    - name: github-actions
      filenames: [action.yml]
    - name: lockfile
      filenames: [uv.lock]
  ignore:
    # Tests assert on purpose; bandit's B101 is noise there.
    - linters: [bandit]
      paths:
        - tests/**
  disabled:
    - svgo
  enabled:
    - oxipng@10.2.0
    - taplo@0.10.0
    - actionlint@1.7.12
    - bandit@1.9.4
    - black@26.10.1
    - checkov@3.3.30
    - git-diff-check
    - isort@9.0.2
    - markdownlint@0.50.0
    - osv-scanner@2.5.1
    - pinact@4.1.1!: { commands: [lint, upgrade] }
    - prettier@3.9.10
    - ruff@0.17.2
    - trufflehog@3.97.1
    - yamllint@1.38.0
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
